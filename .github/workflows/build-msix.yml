name: Собрать установщик для Windows (MSIX)

# Готовый установщик собирается на Windows-сервере GitHub.
# Обычному пользователю Visual Studio не нужна: он скачивает архив
# из раздела Actions (или Releases) — см. INSTALL.md.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Сборка MSIX (x64)
    runs-on: windows-2022

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Установить MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Подготовить сертификат подписи пакета
        shell: pwsh
        env:
          TIMERAPP_CERT_PFX_BASE64: ${{ secrets.TIMERAPP_CERT_PFX_BASE64 }}
          TIMERAPP_CERT_PASSWORD: ${{ secrets.TIMERAPP_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not [string]::IsNullOrWhiteSpace($env:TIMERAPP_CERT_PFX_BASE64)) {
            # Постоянный сертификат владельца из GitHub Secrets:
            # все релизы подписаны одинаково, обновления ставятся поверх
            # с сохранением настроек и пресетов пользователя.
            Write-Host "Используется постоянный сертификат подписи из Secrets."
            $pfxPath = "$env:RUNNER_TEMP\TimerApp.pfx"
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:TIMERAPP_CERT_PFX_BASE64))
            $password = ConvertTo-SecureString -String $env:TIMERAPP_CERT_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -Password $password
          } else {
            # Секретов нет (например, форк или первый запуск): одноразовый
            # сертификат, как раньше. Обновления между такими сборками
            # поверх не встанут — нужен постоянный сертификат, см. SIGNING.md.
            Write-Host "Secrets не заданы: создаётся одноразовый сертификат."
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=TimerAppDev" `
              -KeyUsage DigitalSignature `
              -FriendlyName "TimerApp Certificate" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $password = ConvertTo-SecureString -String "TimerApp123!" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\TimerApp.pfx" -Password $password | Out-Null
          }

          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\TimerApp.cer" | Out-Null
          "CERT_CER=$env:RUNNER_TEMP\TimerApp.cer" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Сертификат подписи: $($cert.Thumbprint)"

      - name: Восстановить пакеты NuGet
        shell: pwsh
        run: msbuild TimerApp.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Собрать MSIX-пакет
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild TimerApp\TimerApp.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms="x64" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$env:CERT_THUMBPRINT"
          if ($LASTEXITCODE -ne 0) { throw "Сборка завершилась с ошибкой $LASTEXITCODE" }

      - name: Собрать однофайловый установщик TimerSetup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package, payload | Out-Null

          $packages = Get-ChildItem -Path TimerApp -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.msix', '.msixbundle', '.appx', '.appxbundle' -and
              $_.FullName -notmatch '\\payload\\'
            }
          if (-not $packages) {
            Write-Host "Каталоги AppPackages в дереве сборки:"
            Get-ChildItem -Path TimerApp -Recurse -Directory -Filter AppPackages -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw "MSIX-пакет не найден при рекурсивном поиске по TimerApp"
          }
          $packages | ForEach-Object { Write-Host "Пакет: $($_.FullName)" }
          $packages | Copy-Item -Destination payload -Force

          Copy-Item "$env:CERT_CER" -Destination "payload\TimerApp.cer" -Force
          Copy-Item "install.ps1" -Destination payload -Force
          Copy-Item "Install.bat" -Destination payload -Force
          Copy-Item "INSTALL.md" -Destination payload -Force

          # Всё содержимое кладём в один архив, который CI встраивает в EXE.
          Compress-Archive -Path "payload\*" -DestinationPath "installer\payload.zip" -Force

          # Графический установщик на C# WinForms: один самодостаточный EXE,
          # внутрь которого встроен только что созданный payload.zip.
          dotnet publish installer\TimerSetup.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o package
          if ($LASTEXITCODE -ne 0) { throw "Сборка TimerSetup.exe завершилась с ошибкой $LASTEXITCODE" }
          Remove-Item package\*.pdb -ErrorAction SilentlyContinue

          Get-ChildItem package | Format-Table Name, Length

      - name: Загрузить готовый установщик (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: TimerApp-Windows-x64
          path: package/*
          if-no-files-found: error

      - name: Опубликовать в Releases (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Таймер ${{ github.ref_name }}"
          body: |
            ## Установка (без Visual Studio)
            1. Скачайте **один файл** — `TimerSetup.exe`.
            2. Запустите его и разрешите права администратора (UAC).
            3. Найдите «Таймер» в меню «Пуск».

            Всё остальное (сертификат, среда выполнения, само приложение)
            уже встроено внутрь TimerSetup.exe. Если Windows покажет
            предупреждение SmartScreen — «Подробнее» → «Выполнить в любом случае»:
            это нормально для программ не из Microsoft Store.
          files: package/*
